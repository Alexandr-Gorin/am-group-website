server {
    server_name microbio.pro www.microbio.pro;
    if ($host = www.microbio.pro) { return 301 https://microbio.pro$request_uri; }
    root /var/www/am-group-website/dist;
    index index.html;
    error_page 404 /pages/error.html;
    if ($request_uri = /index.html) { return 301 https://microbio.pro/; }
    location / { try_files $uri $uri/ =404; }
    location = /pages/error.html { internal; }
    location ~ ^/src/pages/(.+)\.html$ { return 301 /pages/$1; }
    location ~ ^/pages/(.+)\.html$     { return 301 /pages/$1; }
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /webhook/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^(/pages/[^/]+)/$ { return 301 $1; }
    location /pages/ { try_files $uri $uri.html $uri/ =404; }
    location = /main { return 301 /; }
    location = /production { return 301 /pages/catalog; }
    location = /services { return 301 /pages/services; }
    location = /contacts { return 301 /pages/contacts; }
    location = /cookie { return 301 /pages/cookie; }
    location = /policy { return 301 /pages/policy; }
    location = /decoman { return 301 /pages/product-decoman; }
    location = /silotwice { return 301 /pages/product-silo-twice; }
    location = /silorye { return 301 /pages/product-silo-rye; }
    location = /decomanplus { return 301 /pages/product-decoman-plus; }
    location = /rumibact { return 301 /pages/product-rumibact; }
    location = /antoyl { return 301 /pages/product-antoyl; }
    location = /polibact { return 301 /pages/product-polibact; }
    location = /soyariz { return 301 /pages/product-soyariz; }
    location = /rizofosclever { return 301 /pages/product-rizofos-clever; }
    location = /rizofoslucern { return 301 /pages/product-rizofos-lucern; }
    location = /agromik { return 301 /pages/product-agromik; }
    location = /gordeback { return 301 /pages/product-gordeback; }
    location = /bioproductin { return 301 /pages/product-bioproductin; }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/microbio.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/microbio.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
}
server {
    if ($host = www.microbio.pro) { return 301 https://$host$request_uri; }
    if ($host = microbio.pro) { return 301 https://$host$request_uri; }
    listen 80;
    server_name microbio.pro www.microbio.pro;
    return 404;
}
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;
